<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardiff Build Roulette</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="page">
        <h1>Cardiff Build Roulette</h1>

        <div id="youtube-player" class="youtube-player"></div>

        <div id="crowd-preview" class="crowd-preview"></div>

        <section id="controls-panel" class="controls-panel">
            <div id="selected-player-name" class="selected-player-name">Выбери игрока в таблице</div>
            <div class="main-controls-row">
                <button id="roll-button" class="roll-button" disabled>КРУТИТЬ БАРАБАН</button>
                <button id="music-toggle-button" class="music-toggle-button">Музыка<br>ВЫКЛ</button>
            </div>
            <div class="reroll-buttons">
                <button id="reroll-ascendancy-button" class="reroll-button hidden" disabled>крутить подкласс</button>
                <button id="reroll-skill-button" class="reroll-button hidden" disabled>крутить умение</button>
            </div>
            <div id="rerolls-info" class="rerolls-info"></div>
        </section>

        <table id="participants-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Логин</th>
                    <th>Подкласс</th>
                    <th>Умение</th>
                    <th>Был реролл</th>
                    <th>Количество рероллов</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="export-panel">
            <button id="export-csv-button" class="export-csv-button">Скачать результат (CSV)</button>
        </div>
    </main>

    <div id="roulette-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="roulette-player-name"></h2>

            <div class="reels">
                <div id="reel-ascendancy" class="reel"><div class="reel-strip"></div></div>
                <div id="reel-skill" class="reel"><div class="reel-strip"></div></div>
            </div>

            <div id="roulette-result" class="roulette-result hidden">
                <div id="result-ascendancy" class="roulette-result-value"></div>
                <div id="result-skill" class="roulette-result-value"></div>
            </div>

            <button id="roulette-close" class="roulette-close hidden">Закрыть</button>
        </div>
    </div>

    <script src="js/csv.js"></script>
    <script src="js/roulette.js"></script>
    <script src="js/background-music.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
